name: github pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy doc
    runs-on: ubuntu-latest
    permissions:
      contents: write

    container: ghcr.io/c-cube/c-cube-commmon/ci-doc-5.3:latest
    steps:
      - uses: actions/checkout@v6
      - run: opam pin .#HEAD -y -n
      - run: opam install micronats
      - run: opam exec -- odig odoc --cache-dir=_doc/ micronats

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_doc/html
          destination_dir: .
          enable_jekyll: false
