name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  run:
    name: build
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        container:
          - ghcr.io/c-cube/c-cube-commmon/ci-5.1:latest
          - ghcr.io/c-cube/c-cube-commmon/ci-5.4:latest

    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v6
      - run: opam install -t . --deps-only
      - run: opam exec -- dune build @install

      - name: download nats-server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.10.26/nats-server-v2.10.26-linux-amd64.tar.gz -o nats.tar.gz
          tar xzf nats.tar.gz
          mv nats-server-v2.10.26-linux-amd64/nats-server /usr/local/bin/nats-server
          chmod +x /usr/local/bin/nats-server

      - name: run nats-server
        run: nats-server &
      - run: sleep 5

      - run: opam exec -- dune build --profile=release --force @install @runtest

      - name: stop nats-server
        if: always()
        run: killall nats-server || true
